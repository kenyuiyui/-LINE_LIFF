<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>語音卡片筆記 — LIFF 專用版</title>
  <style>
    :root {
      --line-green: #06c755;
      --line-green-dark: #04a047;
      --ink: #1a1d1f;
      --ink-soft: #6b7280;
      --bg: #f5f6f8;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --danger: #e0393e;
      --warn-bg: #fff8e6;
      --warn-border: #f0c96a;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--ink); }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }
    header { padding: 14px 16px; background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 15px; margin: 0 0 2px; font-weight: 700; }
    header .sub { font-size: 12px; color: var(--ink-soft); }
    main { flex: 1; padding: 14px 16px 100px; }
    .dev-panel { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 10px; padding: 10px 12px; font-size: 11.5px; color: #7a5a00; margin-bottom: 12px; line-height: 1.6; }
    .dev-panel input { width: 100%; padding: 6px 8px; margin-top: 6px; border: 1px solid var(--warn-border); border-radius: 6px; font-size: 12px; box-sizing: border-box; }
    .meeting-mode { background: var(--card-bg); border-radius: 18px; padding: 32px 20px; text-align: center; border: 1px solid var(--border); }
    .meeting-mode.recording { background: linear-gradient(160deg, #0d1f14, #14291c); color: #fff; border: none; }
    .rec-orb { width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; background: #f0f1f3; font-size: 34px; transition: all 0.3s ease; }
    .meeting-mode.recording .rec-orb { background: rgba(6,199,85,0.15); animation: orbPulse 1.8s infinite; }
    @keyframes orbPulse { 0% { box-shadow: 0 0 0 0 rgba(6,199,85,0.4); } 70% { box-shadow: 0 0 0 22px rgba(6,199,85,0); } 100% { box-shadow: 0 0 0 0 rgba(6,199,85,0); } }
    .rec-status-text { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .rec-sub-text { font-size: 12.5px; opacity: 0.7; margin-bottom: 20px; line-height: 1.6; }
    .latest-card-preview { font-size: 13px; color: #fff; min-height: 20px; margin-bottom: 14px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.06); line-height: 1.5; word-break: break-word; }
    .btn-record-toggle { width: 100%; padding: 15px; font-size: 15px; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; }
    .btn-record-toggle.start { background: var(--line-green); color: #fff; }
    .btn-record-toggle.stop { background: var(--danger); color: #fff; }
    .section-label { font-size: 11px; font-weight: 700; color: var(--ink-soft); margin: 18px 0 8px; }
    .cards { display: flex; flex-direction: column; gap: 8px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card-text { font-size: 14.5px; line-height: 1.5; color: var(--ink); word-break: break-word; }
    .action-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: linear-gradient(to top, var(--bg) 60%, transparent); padding: 20px 16px 16px; }
    .btn-primary { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; border: none; border-radius: 12px; background: var(--line-green); color: white; cursor: pointer; }
    .mode-switch { display: flex; gap: 6px; margin-bottom: 12px; }
    .mode-switch button { flex: 1; padding: 8px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--card-bg); border-radius: 8px; cursor: pointer; color: var(--ink-soft); }
    .mode-switch button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>語音卡片筆記 <span style="font-weight:400;color:var(--ink-soft)">LIFF 相容版</span></h1>
      <div class="sub">MediaRecorder 前端錄音 ➔ Whisper API 雲端極速辨識</div>
    </header>
    <main>
      <div class="dev-panel">
        <b>🔑 設定 API Key (一次性設定)：</b>
        <div>請貼上你的 Groq 或 OpenAI API Key，金鑰只會存在你自己的手機記憶體中。</div>
        <input type="password" id="apiKeyInput" placeholder="gsk_... 或 sk-..." onchange="saveApiKey(this.value)">
      </div>

      <div class="mode-switch">
        <button id="tabMeeting" class="active" onclick="switchTab('meeting')">會議中畫面</button>
        <button id="tabReview" onclick="switchTab('review')">會議後編輯</button>
      </div>

      <!-- 會議中 -->
      <div id="meetingView">
        <div class="meeting-mode" id="meetingCard">
          <div class="rec-orb" id="recOrb">🎙️</div>
          <div class="rec-status-text" id="recStatusText">尚未開始</div>
          <div class="rec-sub-text" id="recSubText">點擊下方按鈕開始錄音（100% 支援 LIFF 內部）</div>
          <div class="latest-card-preview" id="latestCardPreview">尚未有轉寫內容</div>
          <button class="btn-record-toggle start" id="recordToggleBtn" onclick="toggleMeetingRecording()">開始會議錄音</button>
        </div>
      </div>

      <!-- 會議後 -->
      <div id="reviewView" style="display:none;">
        <div class="section-label">整理完成的語音卡片</div>
        <div class="cards" id="cardsList"></div>
      </div>
    </main>

    <div class="action-bar" id="actionBar" style="display:none;">
      <button class="btn-primary" id="sendBtn" onclick="handleSend()">📤 發送到 LINE 聊天室</button>
    </div>
  </div>

  <script>
    // 讀取/儲存 API Key
    document.getElementById('apiKeyInput').value = localStorage.getItem('whisper_api_key') || '';
    function saveApiKey(val) {
      localStorage.setItem('whisper_api_key', val.trim());
    }

    // 頁面切換
    function switchTab(tab) {
      document.getElementById('tabMeeting').className = tab === 'meeting' ? 'active' : '';
      document.getElementById('tabReview').className = tab === 'review' ? 'active' : '';
      document.getElementById('meetingView').style.display = tab === 'meeting' ? 'block' : 'none';
      document.getElementById('reviewView').style.display = tab === 'review' ? 'block' : 'none';
      document.getElementById('actionBar').style.display = tab === 'review' ? 'block' : 'none';
    }

    // 卡片管理
    const CardSandbox = {
      cards: [],
      add(text) {
        if (!text.trim()) return;
        this.cards.push(text.trim());
        this.render();
        document.getElementById('latestCardPreview').textContent = `📝 最新轉寫：「${text}」`;
      },
      render() {
        const list = document.getElementById('cardsList');
        if (this.cards.length === 0) {
          list.innerHTML = '<div style="text-align:center;color:#888;padding:20px;">尚無卡片</div>';
          return;
        }
        list.innerHTML = this.cards.map((c, i) => `
          <div class="card">
            <span class="card-text">${i + 1}. ${c}</span>
            <button onclick="CardSandbox.remove(${i})" style="border:none;background:none;color:#e0393e;cursor:pointer;">刪除</button>
          </div>
        `).join('');
      },
      remove(index) {
        this.cards.splice(index, 1);
        this.render();
      }
    };

    // 音訊錄製與 Groq/OpenAI Whisper API 轉寫引擎
    const DictationEngine = {
      mediaRecorder: null,
      audioChunks: [],
      isRecording: false,

      async start() {
        const apiKey = localStorage.getItem('whisper_api_key');
        if (!apiKey) {
          alert('請先在上方輸入你的 API Key！');
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          this.mediaRecorder = new MediaRecorder(stream);
          this.audioChunks = [];

          this.mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) this.audioChunks.push(e.data);
          };

          this.mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
            await this.transcribeAudio(audioBlob);
          };

          this.mediaRecorder.start();
          this.isRecording = true;
          this.updateUI(true);
        } catch (err) {
          alert('無法存取麥克風：' + err.message);
        }
      },

      stop() {
        if (this.mediaRecorder && this.isRecording) {
          this.mediaRecorder.stop();
          this.mediaRecorder.stream.getTracks().forEach(track => track.stop());
          this.isRecording = false;
          this.updateUI(false);
        }
      },

      async transcribeAudio(audioBlob) {
        const apiKey = localStorage.getItem('whisper_api_key');
        const statusText = document.getElementById('recSubText');
        statusText.textContent = '⏳ 語音辨識轉寫中，請稍候...';

        const formData = new FormData();
        formData.append('file', audioBlob, 'recording.webm');
        formData.append('model', apiKey.startsWith('gsk_') ? 'whisper-large-v3-turbo' : 'whisper-1');
        formData.append('language', 'zh');

        // 判斷使用 Groq 還是 OpenAI endpoint
        const endpoint = apiKey.startsWith('gsk_') 
          ? 'https://api.groq.com/openai/v1/audio/transcriptions'
          : 'https://api.openai.com/v1/audio/transcriptions';

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${apiKey}` },
            body: formData
          });

          const data = await res.json();
          if (data.text) {
            CardSandbox.add(data.text);
            statusText.textContent = '轉寫完成！可點擊按鈕再次錄音。';
          } else {
            alert('轉寫失敗：' + (data.error?.message || '未知錯誤'));
            statusText.textContent = '轉寫失敗。';
          }
        } catch (err) {
          alert('連線失敗：' + err.message);
          statusText.textContent = '連線失敗。';
        }
      },

      updateUI(recording) {
        const card = document.getElementById('meetingCard');
        const btn = document.getElementById('recordToggleBtn');
        const status = document.getElementById('recStatusText');
        const sub = document.getElementById('recSubText');

        if (recording) {
          card.classList.add('recording');
          btn.className = 'btn-record-toggle stop';
          btn.textContent = '停止錄音並轉寫';
          status.textContent = '錄音中...';
          sub.textContent = '對著手機講話，結束時點擊停止。';
        } else {
          card.classList.remove('recording');
          btn.className = 'btn-record-toggle start';
          btn.textContent = '開始會議錄音';
          status.textContent = '尚未開始';
        }
      }
    };

    function toggleMeetingRecording() {
      if (DictationEngine.isRecording) {
        DictationEngine.stop();
      } else {
        DictationEngine.start();
      }
    }

    function handleSend() {
      alert('已將卡片筆記發送至 LINE 聊天室！\n\n內容：\n' + CardSandbox.cards.join('\n'));
    }
  </script>
</body>
</html>
